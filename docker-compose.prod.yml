  celery-marketjobs-us:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          # US breadth (~10.5k symbols) peaked at 502 MiB in 512M: ~220 MiB is
          # the idle prefork parent, which solo would drop but solo does not
          # enforce soft/hard time limits, the backstop for renewed leases.
          memory: 768M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d marketjobs-us@$$HOSTNAME"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
